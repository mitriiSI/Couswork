name: Build screen recorder (Windows)

on:
  push:
    paths:
      - "screen-recorder/**"
      - ".github/workflows/build-screen-recorder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: screen-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build ScreenRecorder.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ScreenRecorder --icon icon.ico --add-data "icon.ico;."
          --collect-data soundcard --collect-data imageio_ffmpeg
          main.py

      - name: Self-test the .exe (records the screen for a few seconds)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath "dist\ScreenRecorder.exe" -ArgumentList "--selftest", "`"$dir`"" -Wait -PassThru
          Get-Content (Join-Path $dir "selftest.txt")
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder
          path: screen-recorder/dist/ScreenRecorder.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screen-recorder-v1.0.${{ github.run_number }}
          name: Запись экрана 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Программа для записи экрана, звука компьютера, микрофона и веб-камеры (Windows 10/11).
            Скачайте **ScreenRecorder.exe** ниже и запустите его — установка не нужна.
          files: screen-recorder/dist/ScreenRecorder.exe
